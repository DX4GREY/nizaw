name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag untuk release (contoh: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            name: linux-x86_64
            cc: gcc
            cxx: g++
            cmake_extra: ''
            run_tests: true

    env:
      BUILD_TYPE: Release
      BUILD_DIR: build-${{ matrix.arch }}
      ARTIFACT_NAME: nizaw-${{ matrix.name }}.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsystemd-dev libcap-dev

      - name: Configure project
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            ${{ matrix.cmake_extra }}

      - name: Build all targets
        run: |
          cmake --build "${BUILD_DIR}" --parallel

      - name: Run tests
        if: ${{ matrix.run_tests }}
        run: |
          ctest --test-dir "${BUILD_DIR}" --output-on-failure

      - name: Install project to staging directory
        run: |
          cmake --install "${BUILD_DIR}" --prefix "${PWD}/dist/${{ matrix.name }}/pkg"

      - name: Package artifacts
        run: |
          tar -czf "${ARTIFACT_NAME}" -C "${PWD}/dist/${{ matrix.name }}/pkg" .
          ls -lh "${ARTIFACT_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARTIFACT_NAME }}

  package-deb:
    name: Package Debian (.deb)
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release
      BUILD_DIR: build-deb
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsystemd-dev libcap-dev dpkg-dev

      - name: Configure project
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DNIZAW_BUILD_TESTS=OFF

      - name: Build all targets
        run: |
          cmake --build "${BUILD_DIR}" --parallel

      - name: Install to staging directory
        run: |
          cmake --install "${BUILD_DIR}" --prefix "${PWD}/staging"

      - name: Build .deb package
        run: |
          bash packaging/deb/build-deb.sh "${VERSION}" "${PWD}/staging" "${PWD}/packages"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb

  package-rpm:
    name: Package Fedora/RPM (.rpm)
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release
      BUILD_DIR: build-rpm
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsystemd-dev libcap-dev rpm

      - name: Configure project
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DNIZAW_BUILD_TESTS=OFF \
            -DNIZAW_PORTABLE=ON

      - name: Build all targets
        run: |
          cmake --build "${BUILD_DIR}" --parallel

      - name: Install to staging directory
        run: |
          cmake --install "${BUILD_DIR}" --prefix "${PWD}/staging"

      - name: Build .rpm package
        run: |
          bash packaging/rpm/build-rpm.sh "${VERSION}" "${PWD}/staging" "${PWD}/packages"

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: packages/*.rpm

  package-arch:
    name: Package Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release
      BUILD_DIR: build-arch
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsystemd-dev libcap-dev

      - name: Install makepkg and Arch packaging tools
        run: |
          sudo apt-get install -y pacman-package-manager || true
          # makepkg requires a pacman-based system; use a container approach instead
          echo "Using archlinux container for packaging"

      - name: Configure project
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DNIZAW_BUILD_TESTS=OFF

      - name: Build all targets
        run: |
          cmake --build "${BUILD_DIR}" --parallel

      - name: Install to staging directory
        run: |
          cmake --install "${BUILD_DIR}" --prefix "${PWD}/staging"

      - name: Build .pkg.tar.zst package (Arch container)
        run: |
          # makepkg refuses to run as root, so we create a non-root builder user
          # inside the archlinux container to run the packaging.
          # We also pass the packaging script + PKGBUILD from this repo.
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            archlinux:latest \
            bash -cx "
              pacman -Sy --noconfirm base-devel cmake ninja pkg-config systemd-libs openssl zlib sqlite > /dev/null 2>&1
              useradd -m builder
              chown -R builder:builder /work /tmp
              chmod -R a+rX /work
              runuser -u builder -- bash packaging/arch/build-arch.sh '${VERSION}' '/work/staging' '/work/packages'
            "
          ls -lh packages/*.pkg.tar.zst

      - name: Upload .pkg.tar.zst artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packages/*.pkg.tar.zst

  release:
    name: Publish release
    needs: [build, package-deb, package-rpm, package-arch]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$RELEASE_TAG" ]; then
            RANGE="${PREV_TAG}..${RELEASE_TAG}"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log --no-merges --pretty=format:'- %h %s' "$RANGE" | head -n 15 || true)
          if [ -z "$COMMITS" ]; then
            COMMITS='- No commit history available'
          fi

          # Find commit with most changes
          HIGHLIGHT_COMMIT=""
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$RELEASE_TAG" ]; then
            HIGHLIGHT=$(git log --no-merges --pretty=format:'%H %s' "${PREV_TAG}..${RELEASE_TAG}" | while read -r hash msg; do
              changes=$(git diff --shortstat "${PREV_TAG}..${hash}" | awk '{print $4}' | sed 's/[^0-9]//g')
              if [ -n "$changes" ]; then
                echo "$changes $hash $msg"
              fi
            done | sort -rn | head -n 1)
            
            if [ -n "$HIGHLIGHT" ]; then
              HIGHLIGHT_HASH=$(echo "$HIGHLIGHT" | awk '{print $2}')
              HIGHLIGHT_MSG=$(echo "$HIGHLIGHT" | awk '{print $3}')
              HIGHLIGHT_CHANGES=$(echo "$HIGHLIGHT" | awk '{print $1}')
              HIGHLIGHT_COMMIT="- **Highlight**: \`${HIGHLIGHT_HASH:0:7}\` ${HIGHLIGHT_MSG} (${HIGHLIGHT_CHANGES} changes)"
            fi
          fi

          {
            echo "## Release ${RELEASE_TAG}"
            echo ""
            echo "### Build highlights"
            echo "- Linux x86_64 release binary"
            echo "- Release archive includes headers, libraries, and CLI binary"
            echo "- Debian (.deb) package"
            echo "- Fedora/RPM (.rpm) package"
            echo "- Arch Linux (.pkg.tar.zst) package"
            echo ""
            echo "### Recent commits"
            echo "$COMMITS"
            
            if [ -n "$HIGHLIGHT_COMMIT" ]; then
              echo ""
              echo "### Notable changes"
              echo "$HIGHLIGHT_COMMIT"
            fi
          } > release-notes.md

          echo "Generated release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            dist/*/*.tar.gz
            dist/deb-package/*.deb
            dist/rpm-package/*.rpm
            dist/arch-package/*.pkg.tar.zst